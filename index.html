<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>角色應援卡</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100svh;
  background:linear-gradient(180deg,#fff8ef,#ffe2c4);
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
  color:#111;
  overflow:hidden;
}

.app{
  min-height:100svh;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

.round{
  font-size:14px;
  font-weight:800;
  letter-spacing:3px;
  opacity:.5;
}

h1{
  font-size:29px;
  margin:3px 0;
}

.hint{
  margin:0;
  min-height:22px;
}

.table{
  flex:1;
  width:100%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:12px;
  padding-top:10px;
}

.card{
  width:min(43vw,260px);
  height:min(62vw,380px);
  min-width:140px;
  min-height:210px;
  perspective:1000px;
  cursor:pointer;
  touch-action:manipulation;
  transition:
    width .45s ease,
    height .45s ease,
    transform .45s ease,
    opacity .3s ease;
}

.inner{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  transition:transform .65s;
}

.card.flipped .inner{
  transform:rotateY(180deg);
}

.face{
  position:absolute;
  inset:0;
  border:4px solid #111;
  border-radius:22px;
  background:#f28c28;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  box-shadow:0 9px 0 #111,0 17px 25px #0002;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.back{
  font-size:68px;
}

.back small{
  font-size:14px;
  font-weight:900;
  margin-top:15px;
}

.front{
  transform:rotateY(180deg);
}
  .front{
  background:#fff;
  overflow:hidden;
}

.front img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.rabbit{
  font-size:75px;
}

.name{
  font-size:25px;
  font-weight:900;
  margin-top:10px;
}

.controls{
  height:90px;
}

button{
  border:3px solid #111;
  border-radius:100px;
  background:white;
  color:#111;
  font-size:16px;
  font-weight:900;
  padding:13px 23px;
  box-shadow:0 5px 0 #111;
  touch-action:manipulation;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 #111;
}

.hidden{
  display:none;
}

.fade{
  opacity:.25;
  transform:scale(.94);
  transition:.3s;
}

.final .card{
  width:min(50vw,250px);
  height:min(68vw,350px);
}

@media(max-height:650px){
  .app{padding-top:15px}
  .card{height:225px}
}

.card.flipped{
  animation:cardGlow .9s ease-out;
}





@keyframes cardGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,180,80,0))}
  45%{filter:drop-shadow(0 0 24px rgba(255,180,80,.95))}
  100%{filter:drop-shadow(0 0 0 rgba(255,180,80,0))}
}



.final .card{
  animation:finalEnter .55s ease-out;
}

.final .card.flipped{
  animation:finalGlow 1.2s ease-out;
}

@keyframes finalEnter{
  0%{transform:translateY(25px) scale(.9);opacity:0}
  100%{transform:translateY(0) scale(1);opacity:1}
}

@keyframes finalGlow{
  0%{filter:drop-shadow(0 0 0 rgba(255,180,80,0))}
  45%{filter:drop-shadow(0 0 34px rgba(255,180,80,1))}
  100%{filter:drop-shadow(0 0 0 rgba(255,180,80,0))}
}
  .sparkle{
  position:fixed;
  pointer-events:none;
  z-index:9999;
  font-size:22px;
  animation:sparkleFly .9s ease-out forwards;
}

@keyframes sparkleFly{
  0%{
    transform:translate(0,0) scale(.3) rotate(0deg);
    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
      translate(var(--x),var(--y))
      scale(1.15)
      rotate(180deg);
    opacity:0;
  }
}
  .app.reveal-mode .table{
  padding-top:4px;
  align-items:flex-start;
}

.app.reveal-mode .card:not(.selected){
  display:none;
}

.app.reveal-mode .card.selected{
  width:min(78vw,460px);
  height:min(70svh,610px);
  min-width:0;
  min-height:0;
}
</style>
</head>

<body>

<main class="app" id="app">

  <div>
    <div class="round" id="round">ROUND 1</div>
    <h1 id="title">今天邀請了一些角色</h1>
    <p class="hint" id="hint">請幫我選一張卡牌 ✨</p>
  </div>

  <div class="table" id="table"></div>

  <div class="controls">
    <button id="next" class="hidden">
      下一位角色 →
    </button>

    <button id="finalButton" class="hidden">
      最後一位由我來邀請 🐰
    </button>
  </div>

</main>

<script>
const table = document.getElementById("table");
const title = document.getElementById("title");
const hint = document.getElementById("hint");
const round = document.getElementById("round");
const app = document.getElementById("app");

let stage = 1;
let selected = false;
let awaitingNext = false;

const characters = [
  {
    image:"IMG_0292.jpeg",
    name:"浣熊"
  },
  {
    image:"IMG_0289.jpeg",
    name:"烏薩奇"
  }
];


function makeCard(character){

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <div class="inner">

      <div class="face back">
        🐰
        <small>點擊選擇</small>
      </div>

      <div class="face front">
        <img src="${character.image}" alt="${character.name}">
      </div>

    </div>
  `;

  card.addEventListener("click",function(){

    chooseCard(card);

  });

  return card;
}


function loadRound(){

  selected = false;
  awaitingNext = false;

  app.classList.remove("reveal-mode");
  app.classList.remove("final");

  table.innerHTML = "";

  const character = characters[stage - 1];

  table.appendChild(makeCard(character));
  table.appendChild(makeCard(character));

  round.textContent = "ROUND " + stage;

  title.textContent = "請選擇一張卡牌";

  hint.textContent =
    stage === 1
    ? "看看第一位來幫我加油的是誰 ✨"
    : "再幫我選出第二位角色 ✨";
}


function chooseCard(card){

  if(selected) return;

  selected = true;

  card.classList.add("selected");

  app.classList.add("reveal-mode");

  setTimeout(function(){

    card.classList.add("flipped");

    createSparkles(card,12);

  },300);

  setTimeout(function(){

    hint.textContent =
      stage === 1
      ? "✨ 浣熊來幫我加油了！・輕觸畫面繼續"
      : "✨ 烏薩奇也來了！・輕觸畫面繼續";

    awaitingNext = true;

  },850);

}


document.addEventListener("click",function(){

  if(!awaitingNext) return;

  awaitingNext = false;

  if(stage === 1){

    stage = 2;

    loadRound();

  }else if(stage === 2){

    showFinal();

  }

});


function showFinal(){

  selected = false;
  awaitingNext = false;

  app.classList.remove("reveal-mode");
  app.classList.add("final");

  round.textContent = "FINAL";

  title.textContent = "最後一位角色";

  hint.textContent = "這一位，是我自己邀請來的。";

  table.innerHTML = "";

  const card = document.createElement("div");

  card.className = "card";

  card.innerHTML = `
    <div class="inner">

      <div class="face back">
        🐰
        <small>點擊揭曉</small>
      </div>

      <div class="face front">
        <img src="IMG_0290.jpeg" alt="兔之助">
      </div>

    </div>
  `;

  table.appendChild(card);

  card.addEventListener("click",function(){

    if(selected) return;

    selected = true;

    card.classList.add("selected");

    app.classList.add("reveal-mode");

    hint.textContent =
      "準備好迎接最後一位了嗎？ ✨";

    setTimeout(function(){

      card.classList.add("flipped");

      createSparkles(card,24);

    },300);

    setTimeout(function(){

      hint.textContent =
        "✨ 兔之助登場！✨";

    },900);

  });

}

function createSparkles(card, amount = 12){
  const rect = card.getBoundingClientRect();

  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;

  const symbols = ["✨","⭐","✦","⋆"];

  for(let i = 0; i < amount; i++){

    const sparkle = document.createElement("div");

    sparkle.className = "sparkle";

    sparkle.textContent =
      symbols[Math.floor(Math.random() * symbols.length)];

    sparkle.style.left = centerX + "px";
    sparkle.style.top = centerY + "px";

    const angle = Math.random() * Math.PI * 2;

    const distance = 70 + Math.random() * 100;

    sparkle.style.setProperty(
      "--x",
      Math.cos(angle) * distance + "px"
    );

    sparkle.style.setProperty(
      "--y",
      Math.sin(angle) * distance + "px"
    );

    document.body.appendChild(sparkle);

    setTimeout(function(){
      sparkle.remove();
    },1000);
  }
}

loadRound();

</script>

</body>
</html>
